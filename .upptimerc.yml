owner: Rockpin
repo: status

sites:
  - name: 웹
    slug: web
    url: https://rockp.in
  - name: CDN
    slug: cdn
    url: https://cdn.rockp.in/static/health.txt

status-website:
  baseUrl: /status
  name: Rockpin Status
  theme: light
  logoUrl: https://cdn.rockp.in/static/brand/symbol-96.png
  favicon: https://cdn.rockp.in/static/brand/symbol-96.png
  faviconSvg: https://cdn.rockp.in/static/brand/symbol-96.png
  customHeadHtml: |
    <style>
      html:root {
        --body-background-color: #ffffff;
        --body-text-color: #000000;
        --card-background-color: #ffffff;
        --card-border-color: #e5e5e5;
        --nav-background-color: #ffffff;
        --nav-border-bottom-color: #e5e5e5;
        --nav-current-border-bottom-color: #000000;
        --up-border-left-color: #000000;
        --degraded-border-left-color: #8a8a8a;
        --down-border-left-color: #000000;
        --down-background-color: #f2f2f2;
        --tag-color: #ffffff;
        --tag-up-background-color: #000000;
        --tag-degraded-background-color: #8a8a8a;
        --tag-down-background-color: #000000;
        --change-background-color: #e5e5e5;
        --error-button-border-color: #000000;
        --error-button-background-color: #000000;
        --error-button-color: #ffffff;
        --submit-button-border-color: #000000;
        --submit-button-background-color: #000000;
        --submit-button-color: #ffffff;
        --graph-filter: grayscale(100%);
      }
      .submit-button { background: #000 !important; color: #fff !important; }
      img.graph, .graph img, section img:not(.icon) { filter: grayscale(100%); }
      nav .logo img { display: none !important; }
      nav .logo div {
        font-size: 0 !important; color: transparent !important;
        width: 82px; height: 24px;
        background: url(https://cdn.rockp.in/static/brand/wordmark.svg) no-repeat left center / contain;
      }
    </style>
  customBodyHtml: |
    <script>
      (function () {
        var strip = function () {
          document.querySelectorAll('article').forEach(function (a) {
            a.childNodes.forEach(function (n) {
              if (n.nodeType === 3 && n.nodeValue.indexOf('✅') !== -1) n.nodeValue = '';
            });
          });
        };
        new MutationObserver(strip).observe(document.documentElement, { childList: true, subtree: true });
        strip();
      })();
    </script>
  introTitle: "**Rockpin** 서비스 상태"
  introMessage: 각 서비스의 실시간 상태와 장애 기록을 확인할 수 있습니다.
  navbar:
    - title: 상태
      href: /
    - title: Rockpin
      href: https://rockp.in

