name: Status Page → Cloudflare Pages

on:
  push:
    branches: [master]
    paths: ['page/**', '.github/workflows/page.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy page --project-name=rockpinstatus --branch=master
