<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rockpin Status</title>
  <link rel="icon" type="image/png" href="https://cdn.rockpin.ai/static/brand/symbol-96.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <style>
    :root {
      --bg: #ffffff;
      --text: #000000;
      --muted: #737373;
      --border: #e5e5e5;
      --bar-ok: #000000;
      --bar-partial: #8a8a8a;
      --bar-empty: #ececec;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text); }
    body {
      font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased;
    }
    .container { max-width: 850px; margin: 0 auto; padding: 0 16px; }

    header { padding: 48px 0 40px; }
    header a { display: inline-block; }
    header img { display: block; height: 28px; width: auto; }

    .banner {
      background: var(--text); color: var(--bg);
      border-radius: 4px; padding: 16px 20px;
      font-size: 19px; font-weight: 600; margin-bottom: 32px;
    }
    .banner.issue { background: var(--bar-partial); }

    .components { border: 1px solid var(--border); border-radius: 4px; }
    .component { padding: 20px; }
    .component + .component { border-top: 1px solid var(--border); }
    .row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
    .name { font-weight: 600; font-size: 16px; }
    .state { font-size: 14px; }
    .state.down, .state.degraded { font-weight: 600; }

    .bars { display: flex; gap: 2px; height: 34px; margin: 12px 0 8px; }
    .bar { flex: 1; min-width: 0; border-radius: 1px; background: var(--bar-ok); position: relative; cursor: default; }
    .bar.empty { background: var(--bar-empty); }
    .bar.partial { background: var(--bar-partial); }
    .bar.major { background: var(--bg); box-shadow: inset 0 0 0 1.5px var(--bar-ok); }
    .bar:hover, .bar:focus { opacity: .6; outline: none; }

    .legend { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 13px; }
    .legend .line { flex: 1; height: 1px; background: var(--border); }

    .tip {
      position: fixed; z-index: 10; pointer-events: none;
      background: var(--bg); color: var(--text);
      border: 1px solid var(--border); border-radius: 4px;
      box-shadow: 0 4px 16px rgba(0,0,0,.08);
      padding: 10px 12px; font-size: 13px; white-space: nowrap; display: none;
    }
    .tip b { display: block; margin-bottom: 2px; }

    footer { padding: 28px 0 48px; color: var(--muted); font-size: 13px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    footer a { color: inherit; }

    .loading, .error { padding: 40px 20px; text-align: center; color: var(--muted); }

    @media (max-width: 600px) {
      header { padding: 32px 0 28px; }
      .banner { font-size: 17px; }
      .bar:nth-last-child(n+31) { display: none; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <a href="https://app.rockpin.ai" aria-label="록핀">
        <img src="https://cdn.rockpin.ai/static/brand/wordmark.svg" alt="록핀" width="96" height="28">
      </a>
    </header>

    <main>
      <div id="banner"></div>
      <div class="components" id="components"><div class="loading">불러오는 중</div></div>
    </main>

    <footer>
      <span id="updated"></span>
      <a href="https://app.rockpin.ai">rockpin.ai</a>
    </footer>
  </div>

  <div class="tip" id="tip" role="tooltip"></div>

  <script>
    const DATA = 'https://raw.githubusercontent.com/Rockpin/status/master/history/';
    const DAYS = 90;
    const MAJOR_MINUTES = 60;
    const STATE_TEXT = { up: '정상', degraded: '지연', down: '장애' };

    const pad = n => String(n).padStart(2, '0');
    const dayKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    const dayLabel = d => `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일`;

    async function startDate(slug) {
      try {
        const text = await fetch(DATA + slug + '.yml', { cache: 'no-cache' }).then(r => r.text());
        const m = text.match(/^startTime:\s*(.+)$/m);
        return m ? new Date(m[1].trim()) : null;
      } catch { return null; }
    }

    function days() {
      const out = [];
      const today = new Date(); today.setHours(0, 0, 0, 0);
      for (let i = DAYS - 1; i >= 0; i--) {
        const d = new Date(today); d.setDate(today.getDate() - i); out.push(d);
      }
      return out;
    }

    function renderComponent(site, start) {
      const down = site.dailyMinutesDown || {};
      const startDay = start ? new Date(start.getFullYear(), start.getMonth(), start.getDate()) : null;
      let monitored = 0, minutes = 0;

      const bars = days().map(d => {
        const key = dayKey(d);
        const mins = down[key] || 0;
        let cls = 'bar', note = '장애 없음';
        if (startDay && d < startDay) { cls += ' empty'; note = '기록 없음'; }
        else {
          monitored++; minutes += mins;
          if (mins >= MAJOR_MINUTES) { cls += ' major'; note = `${mins}분 장애`; }
          else if (mins > 0) { cls += ' partial'; note = `${mins}분 장애`; }
        }
        return `<div class="${cls}" tabindex="0" data-date="${dayLabel(d)}" data-note="${note}"></div>`;
      }).join('');

      const uptime = monitored ? (100 - minutes / (monitored * 1440) * 100) : 100;
      const state = site.status in STATE_TEXT ? site.status : 'up';

      return `
        <div class="component">
          <div class="row">
            <span class="name">${site.name}</span>
            <span class="state ${state}">${STATE_TEXT[state]}</span>
          </div>
          <div class="bars">${bars}</div>
          <div class="legend">
            <span class="from">${DAYS}일 전</span>
            <span class="line"></span>
            <span>가동률 ${uptime.toFixed(2)}%</span>
            <span class="line"></span>
            <span>오늘</span>
          </div>
        </div>`;
    }

    function renderBanner(sites) {
      const bad = sites.filter(s => s.status !== 'up');
      const el = document.getElementById('banner');
      if (!bad.length) {
        el.className = 'banner';
        el.textContent = '모든 서비스가 정상 운영 중입니다';
      } else {
        el.className = 'banner issue';
        el.textContent = `${bad.map(s => s.name).join(', ')} 서비스에 문제가 있습니다`;
      }
    }

    function bindTips() {
      const tip = document.getElementById('tip');
      const show = e => {
        const b = e.target.closest('.bar'); if (!b) return;
        tip.innerHTML = `<b>${b.dataset.date}</b>${b.dataset.note}`;
        tip.style.display = 'block';
        const r = b.getBoundingClientRect();
        const w = tip.offsetWidth;
        const left = Math.min(Math.max(8, r.left + r.width / 2 - w / 2), innerWidth - w - 8);
        tip.style.left = left + 'px';
        tip.style.top = (r.top - tip.offsetHeight - 8) + 'px';
      };
      const hide = () => { tip.style.display = 'none'; };
      const root = document.getElementById('components');
      root.addEventListener('mouseover', show);
      root.addEventListener('focusin', show);
      root.addEventListener('mouseout', hide);
      root.addEventListener('focusout', hide);
      addEventListener('scroll', hide, { passive: true });
    }

    function updateMobileLabel() {
      const label = matchMedia('(max-width: 600px)').matches ? '30일 전' : `${DAYS}일 전`;
      document.querySelectorAll('.legend .from').forEach(el => { el.textContent = label; });
    }

    async function load() {
      const root = document.getElementById('components');
      try {
        const sites = await fetch(DATA + 'summary.json', { cache: 'no-cache' }).then(r => r.json());
        const starts = await Promise.all(sites.map(s => startDate(s.slug)));
        renderBanner(sites);
        root.innerHTML = sites.map((s, i) => renderComponent(s, starts[i])).join('');
        updateMobileLabel();
        const now = new Date();
        document.getElementById('updated').textContent =
          `마지막 확인 ${now.getHours()}:${pad(now.getMinutes())} · 5분마다 갱신`;
      } catch {
        root.innerHTML = '<div class="error">상태 정보를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.</div>';
      }
    }

    bindTips();
    matchMedia('(max-width: 600px)').addEventListener('change', updateMobileLabel);
    load();
    setInterval(load, 5 * 60 * 1000);
  </script>
</body>
</html>
